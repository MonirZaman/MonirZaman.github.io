<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 540" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Prefill reads the whole prompt in one pass; decode runs one pass per output token" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="340" height="540" fill="#fff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#0969da">Prefill: one pass over the whole prompt</text>
  <text x="20" y="48" font-size="12" fill="#59636e">all tokens in parallel · limited by arithmetic (FLOPS)</text>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">
    <g fill="#fff" stroke="#0969da" stroke-width="1.5">
      <rect x="20" y="70" width="46" height="22" rx="4"/><rect x="20" y="98" width="46" height="22" rx="4"/><rect x="20" y="126" width="46" height="22" rx="4"/><rect x="20" y="154" width="46" height="22" rx="4"/><rect x="20" y="182" width="46" height="22" rx="4"/>
    </g>
    <g fill="#1f2328" text-anchor="middle"><text x="43" y="85">Water</text><text x="43" y="113">boils</text><text x="43" y="141">at</text><text x="43" y="169">sea</text><text x="43" y="197">…</text></g>
  </g>
  <g stroke="#0969da" stroke-width="1.6" fill="none">
    <path d="M68 81 H112"/><path d="M68 109 H112"/><path d="M68 137 H112"/><path d="M68 165 H112"/><path d="M68 193 H112"/>
  </g>
  <rect x="114" y="66" width="104" height="142" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/>
  <text x="166" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">model</text>
  <text x="166" y="150" text-anchor="middle" font-size="11" fill="#59636e">weights read once</text>
  <path d="M220 137 H262" stroke="#0969da" stroke-width="1.8" marker-end="url(#ab)"/>
  <rect x="266" y="125" width="52" height="24" rx="4" fill="#0969da"/><text x="292" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">100</text>
  <text x="292" y="166" text-anchor="middle" font-size="11" fill="#59636e">first token</text>
  <path d="M166 210 V236" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
  <rect x="96" y="238" width="140" height="22" rx="5" fill="#f3eefe" stroke="#6d28d9"/>
  <text x="166" y="253" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="600">writes K,V for 6 tokens</text>

  <line x1="20" y1="268" x2="320" y2="268" stroke="#d0d7de" stroke-dasharray="4 4"/><g transform="translate(-346,272)">

  <text x="366" y="30" font-size="15" font-weight="700" fill="#bc4c00">Decode: one pass per new token</text>
  <text x="366" y="48" font-size="12" fill="#59636e">one token at a time · limited by memory bandwidth</text>
  <rect x="366" y="125" width="52" height="24" rx="4" fill="#fff" stroke="#bc4c00" stroke-width="1.5"/><text x="392" y="141" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace,Menlo,Consolas,monospace">°C</text>
  <path d="M420 137 H452" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#ao)"/>
  <rect x="456" y="96" width="104" height="82" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.8"/>
  <text x="508" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">model</text>
  <text x="508" y="151" text-anchor="middle" font-size="11" fill="#59636e">all weights, again</text>
  <path d="M562 137 H594" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#ao)"/>
  <rect x="598" y="125" width="52" height="24" rx="4" fill="#bc4c00"/><text x="624" y="141" text-anchor="middle" font-size="12" fill="#fff" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">,</text>
  <path d="M624 122 C624 70, 392 70, 392 120" fill="none" stroke="#bc4c00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="508" y="66" text-anchor="middle" font-size="11.5" fill="#bc4c00">append it, run again</text>
  <rect x="438" y="214" width="140" height="22" rx="5" fill="#f3eefe" stroke="#6d28d9"/>
  <text x="508" y="229" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="600">KV cache</text>
  <path d="M490 212 V182" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
  <path d="M528 182 V210" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
  <text x="484" y="200" text-anchor="end" font-size="10.5" fill="#6d28d9">reads all</text>
  <text x="534" y="200" font-size="10.5" fill="#6d28d9">adds 1</text>
  </g><defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bc4c00"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
  </defs>
</svg>
