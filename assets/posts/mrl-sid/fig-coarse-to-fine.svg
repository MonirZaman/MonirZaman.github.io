<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" role="img" aria-label="Both go coarse to fine: LinkedIn cuts a vector by length, YouTube cuts a code by depth"><title>Both go coarse to fine: LinkedIn cuts a vector by length, YouTube cuts a code by depth</title>
<style>
  .ink{fill:#1f2328} .quiet{fill:#59636e} .edge{stroke:#8c959f} .box{fill:none;stroke:#8c959f;stroke-width:1.25}
  .hi{fill:#0969da;fill-opacity:.10;stroke:#0969da;stroke-width:2} .arrowhead{fill:#8c959f} .bg{fill:#ffffff}
  .sid{fill:#7c3aed;fill-opacity:.10;stroke:#7c3aed;stroke-width:2} .key{fill:#59636e;fill-opacity:.07;stroke:#59636e;stroke-width:1.75}
  .l1{fill:#5b21b6;fill-opacity:.16;stroke:#5b21b6;stroke-width:2} .l2{fill:#7c3aed;fill-opacity:.12;stroke:#7c3aed;stroke-width:2}
  .l3{fill:#a78bfa;fill-opacity:.14;stroke:#a78bfa;stroke-width:2} .l4{fill:#c4b5fd;fill-opacity:.18;stroke:#c4b5fd;stroke-width:2}
  .mrl-ink{fill:#0969da} .sid-ink{fill:#6d28d9}
  text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="760" height="474"/><text class="ink" x="24" y="30" font-size="15" font-weight="600">Both go coarse to fine: LinkedIn cuts a vector by length, YouTube cuts a code by depth</text><text class="mrl-ink" x="24" y="66" text-anchor="start" font-size="13">LinkedIn MUSE · Matryoshka embedding</text><text class="quiet" x="24" y="86" text-anchor="start" font-size="11.5">one continuous vector; every prefix is itself a usable embedding</text><rect class="hi" x="24" y="100" width="89" height="40"/><text class="ink" x="68.5" y="124" text-anchor="middle" font-size="11.5">1–512</text><rect class="hi" x="113" y="100" width="89" height="40"/><text class="ink" x="157.5" y="124" text-anchor="middle" font-size="11.5">513–1,024</text><rect class="hi" x="202" y="100" width="178" height="40"/><text class="ink" x="291.0" y="124" text-anchor="middle" font-size="11.5">1,025–2,048</text><rect class="box" x="380" y="100" width="356" height="40"/><text class="ink" x="558.0" y="124" text-anchor="middle" font-size="11.5">2,049–4,096</text><text class="quiet" x="24" y="160" text-anchor="start" font-size="11.5">coarse: title, seniority, location</text><text class="quiet" x="736" y="160" text-anchor="end" font-size="11.5">fine: qualifications, career trajectory</text><path class="edge" d="M24 174V180H380V174" fill="none"/><text class="ink" x="24" y="198" text-anchor="start" font-size="11.5">2,048-d prefix → IVFPQ retrieval over 1.3B+ profiles</text><path class="edge" d="M24 210V216H736V210" fill="none"/><text class="ink" x="24" y="234" text-anchor="start" font-size="11.5">full 4,096-d vector → features for the L2 ranker</text><text class="sid-ink" x="24" y="270" text-anchor="start" font-size="13">YouTube PLUM · semantic ID</text><text class="quiet" x="24" y="290" text-anchor="start" font-size="11.5">one discrete code; each level quantizes what the previous levels left over</text><rect class="l1" x="24" y="300" width="128" height="56" rx="8"/><text class="ink" x="88.0" y="324" text-anchor="middle" font-size="13" font-weight="600">level 1</text><text class="ink" x="88.0" y="344" text-anchor="middle" font-size="11.5">2,048 codes</text><path class="edge" d="M152 328H168" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="l2" x="170" y="300" width="128" height="56" rx="8"/><text class="ink" x="234.0" y="324" text-anchor="middle" font-size="13" font-weight="600">level 2</text><text class="ink" x="234.0" y="344" text-anchor="middle" font-size="11.5">1,024 codes</text><path class="edge" d="M298 328H314" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="l3" x="316" y="300" width="128" height="56" rx="8"/><text class="ink" x="380.0" y="324" text-anchor="middle" font-size="13" font-weight="600">level 3</text><text class="ink" x="380.0" y="344" text-anchor="middle" font-size="11.5">512 codes</text><path class="edge" d="M444 328H460" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="l4" x="462" y="300" width="128" height="56" rx="8"/><text class="ink" x="526.0" y="324" text-anchor="middle" font-size="13" font-weight="600">level 4</text><text class="ink" x="526.0" y="344" text-anchor="middle" font-size="11.5">256 codes</text><path class="edge" d="M590 328H606" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="box" x="608" y="300" width="128" height="56" rx="8"/><text class="ink" x="672.0" y="324" text-anchor="middle" font-size="13" font-weight="600">… level L</text><text class="quiet" x="672.0" y="344" text-anchor="middle" font-size="11.5">2,048 / 2^(L−1)</text><path class="edge" d="M24 372V378H298V372" fill="none"/><text class="ink" x="24" y="396" text-anchor="start" font-size="11.5">prefix (c1, c2) → a neighborhood of similar videos; progressive masking trains every prefix</text><path class="edge" d="M24 408V414H736V408" fill="none"/><text class="ink" x="24" y="432" text-anchor="start" font-size="11.5">all L codes → one video; the LLM generates them token by token</text><text class="quiet" x="24" y="458" text-anchor="start" font-size="11.5">Sizes follow PLUM's rule 2,048 / 2^(ℓ−1); the paper doesn't say how many levels L there are.</text></svg>