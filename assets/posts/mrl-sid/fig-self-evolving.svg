<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Two agent loops share one experiment journal"><title>Two agent loops share one experiment journal</title>
<style>
  .ink{fill:#1f2328} .quiet{fill:#59636e} .edge{stroke:#8c959f} .box{fill:none;stroke:#8c959f;stroke-width:1.25}
  .hi{fill:#0969da;fill-opacity:.10;stroke:#0969da;stroke-width:2} .arrowhead{fill:#8c959f} .bg{fill:#ffffff}
  .sid{fill:#7c3aed;fill-opacity:.10;stroke:#7c3aed;stroke-width:2} .key{fill:#59636e;fill-opacity:.07;stroke:#59636e;stroke-width:1.75}
  .l1{fill:#5b21b6;fill-opacity:.16;stroke:#5b21b6;stroke-width:2} .l2{fill:#7c3aed;fill-opacity:.12;stroke:#7c3aed;stroke-width:2}
  .l3{fill:#a78bfa;fill-opacity:.14;stroke:#a78bfa;stroke-width:2} .l4{fill:#c4b5fd;fill-opacity:.18;stroke:#c4b5fd;stroke-width:2}
  .mrl-ink{fill:#0969da} .sid-ink{fill:#6d28d9}
  text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="760" height="200"/><text class="ink" x="24" y="30" font-size="15" font-weight="600">Two agent loops share one experiment journal</text><rect class="box" x="24" y="56" width="128" height="76" rx="8"/><text class="ink" x="88.0" y="80" text-anchor="middle" font-size="13" font-weight="600">Offline agent</text><text class="quiet" x="88.0" y="100" text-anchor="middle" font-size="11.5">fast loop,</text><text class="quiet" x="88.0" y="116" text-anchor="middle" font-size="11.5">proposes changes</text><path class="edge" d="M152 94H168" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="box" x="170" y="56" width="128" height="76" rx="8"/><text class="ink" x="234.0" y="80" text-anchor="middle" font-size="13" font-weight="600">Train and score</text><text class="quiet" x="234.0" y="100" text-anchor="middle" font-size="11.5">offline loss or</text><text class="quiet" x="234.0" y="116" text-anchor="middle" font-size="11.5">proxy metric</text><path class="edge" d="M298 94H314" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="key" x="316" y="56" width="128" height="76" rx="8"/><text class="ink" x="380.0" y="80" text-anchor="middle" font-size="13" font-weight="600">Journal</text><text class="ink" x="380.0" y="100" text-anchor="middle" font-size="11.5">every config</text><text class="ink" x="380.0" y="116" text-anchor="middle" font-size="11.5">+ its results</text><path class="edge" d="M444 94H460" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="box" x="462" y="56" width="128" height="76" rx="8"/><text class="ink" x="526.0" y="80" text-anchor="middle" font-size="13" font-weight="600">Online agent</text><text class="quiet" x="526.0" y="100" text-anchor="middle" font-size="11.5">slow loop, picks</text><text class="quiet" x="526.0" y="116" text-anchor="middle" font-size="11.5">top-K to test</text><path class="edge" d="M590 94H606" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="box" x="608" y="56" width="128" height="76" rx="8"/><text class="ink" x="672.0" y="80" text-anchor="middle" font-size="13" font-weight="600">A/B test</text><text class="quiet" x="672.0" y="100" text-anchor="middle" font-size="11.5">live north-star</text><text class="quiet" x="672.0" y="116" text-anchor="middle" font-size="11.5">metrics</text><path class="edge" d="M672 132V156H392V134" fill="none" stroke-width="1.25" marker-end="url(#a)"/><path class="edge" d="M368 132V180H88V134" fill="none" stroke-width="1.25" marker-end="url(#a)"/><text class="quiet" x="532" y="150" text-anchor="middle" font-size="11.5">online metrics</text><text class="quiet" x="228" y="174" text-anchor="middle" font-size="11.5">past results shape new ideas</text></svg>