<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" role="img" aria-label="Stateless sub-agents run the loop; the orchestrator holds the state"><title>Stateless sub-agents run the loop; the orchestrator holds the state</title>
<style>
  .ink{fill:#1f2328} .quiet{fill:#59636e} .edge{stroke:#8c959f} .box{fill:none;stroke:#8c959f;stroke-width:1.25}
  .hi{fill:#0969da;fill-opacity:.10;stroke:#0969da;stroke-width:2} .arrowhead{fill:#8c959f} .bg{fill:#ffffff}
  .sid{fill:#7c3aed;fill-opacity:.10;stroke:#7c3aed;stroke-width:2} .key{fill:#59636e;fill-opacity:.07;stroke:#59636e;stroke-width:1.75}
  .l1{fill:#5b21b6;fill-opacity:.16;stroke:#5b21b6;stroke-width:2} .l2{fill:#7c3aed;fill-opacity:.12;stroke:#7c3aed;stroke-width:2}
  .l3{fill:#a78bfa;fill-opacity:.14;stroke:#a78bfa;stroke-width:2} .l4{fill:#c4b5fd;fill-opacity:.18;stroke:#c4b5fd;stroke-width:2}
  .mrl-ink{fill:#0969da} .sid-ink{fill:#6d28d9}
  text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="760" height="216"/><text class="ink" x="24" y="30" font-size="15" font-weight="600">Stateless sub-agents run the loop; the orchestrator holds the state</text><rect class="key" x="24" y="48" width="712" height="40" rx="8"/><text class="ink" x="380" y="72" text-anchor="middle" font-size="13">Orchestrator + knowledge base: holds all state, sends each sub-agent its context</text><rect class="box" x="24" y="120" width="128" height="76" rx="8"/><text class="ink" x="88.0" y="144" text-anchor="middle" font-size="13" font-weight="600">Ideator</text><text class="quiet" x="88.0" y="164" text-anchor="middle" font-size="11.5">ideas from KB</text><text class="quiet" x="88.0" y="180" text-anchor="middle" font-size="11.5">and literature</text><path class="edge" d="M154 158H168" fill="none" stroke-width="1.25" marker-end="url(#a)" marker-start="url(#a)"/><rect class="box" x="170" y="120" width="128" height="76" rx="8"/><text class="ink" x="234.0" y="144" text-anchor="middle" font-size="13" font-weight="600">Critic</text><text class="quiet" x="234.0" y="164" text-anchor="middle" font-size="11.5">reviews each</text><text class="quiet" x="234.0" y="180" text-anchor="middle" font-size="11.5">idea first</text><path class="edge" d="M298 158H314" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="box" x="316" y="120" width="128" height="76" rx="8"/><text class="ink" x="380.0" y="144" text-anchor="middle" font-size="13" font-weight="600">Coding agent</text><text class="quiet" x="380.0" y="164" text-anchor="middle" font-size="11.5">edits code on</text><text class="quiet" x="380.0" y="180" text-anchor="middle" font-size="11.5">a new branch</text><path class="edge" d="M444 158H460" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="box" x="462" y="120" width="128" height="76" rx="8"/><text class="ink" x="526.0" y="144" text-anchor="middle" font-size="13" font-weight="600">Train and eval</text><text class="quiet" x="526.0" y="164" text-anchor="middle" font-size="11.5">2M-step TPU run</text><text class="quiet" x="526.0" y="180" text-anchor="middle" font-size="11.5">NDCG, recall</text><path class="edge" d="M590 158H606" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="box" x="608" y="120" width="128" height="76" rx="8"/><text class="ink" x="672.0" y="144" text-anchor="middle" font-size="13" font-weight="600">Keep / revert</text><text class="quiet" x="672.0" y="164" text-anchor="middle" font-size="11.5">commit if better,</text><text class="quiet" x="672.0" y="180" text-anchor="middle" font-size="11.5">else roll back</text><path class="edge" d="M88 88V118" fill="none" stroke-width="1.25" marker-end="url(#a)"/><path class="edge" d="M672 120V90" fill="none" stroke-width="1.25" marker-end="url(#a)"/><text class="quiet" x="96" y="108" text-anchor="start" font-size="11.5">context</text><text class="quiet" x="664" y="108" text-anchor="end" font-size="11.5">results</text></svg>