<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 184" role="img" aria-label="Token Factory packs each watched item into one soft token"><title>Token Factory packs each watched item into one soft token</title>
<style>
  .ink{fill:#1f2328} .quiet{fill:#59636e} .edge{stroke:#8c959f} .box{fill:none;stroke:#8c959f;stroke-width:1.25}
  .hi{fill:#0969da;fill-opacity:.10;stroke:#0969da;stroke-width:2} .arrowhead{fill:#8c959f} .bg{fill:#ffffff}
  .sid{fill:#7c3aed;fill-opacity:.10;stroke:#7c3aed;stroke-width:2} .key{fill:#59636e;fill-opacity:.07;stroke:#59636e;stroke-width:1.75}
  .l1{fill:#5b21b6;fill-opacity:.16;stroke:#5b21b6;stroke-width:2} .l2{fill:#7c3aed;fill-opacity:.12;stroke:#7c3aed;stroke-width:2}
  .l3{fill:#a78bfa;fill-opacity:.14;stroke:#a78bfa;stroke-width:2} .l4{fill:#c4b5fd;fill-opacity:.18;stroke:#c4b5fd;stroke-width:2}
  .mrl-ink{fill:#0969da} .sid-ink{fill:#6d28d9}
  text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="760" height="184"/><text class="ink" x="24" y="30" font-size="15" font-weight="600">Token Factory packs each watched item into one soft token</text><rect class="box" x="24" y="56" width="160" height="76" rx="8"/><text class="ink" x="104.0" y="80" text-anchor="middle" font-size="13" font-weight="600">Item features</text><text class="quiet" x="104.0" y="100" text-anchor="middle" font-size="11.5">SID, channel,</text><text class="quiet" x="104.0" y="116" text-anchor="middle" font-size="11.5">client, watch time</text><path class="edge" d="M184 94H206" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="key" x="208" y="56" width="160" height="76" rx="8"/><text class="ink" x="288.0" y="80" text-anchor="middle" font-size="13" font-weight="600">Token maker</text><text class="ink" x="288.0" y="100" text-anchor="middle" font-size="11.5">MLP, co-trained</text><text class="ink" x="288.0" y="116" text-anchor="middle" font-size="11.5">→ 1 soft token</text><path class="edge" d="M368 94H390" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="box" x="392" y="56" width="160" height="76" rx="8"/><text class="ink" x="472.0" y="80" text-anchor="middle" font-size="13" font-weight="600">Compress (optional)</text><text class="quiet" x="472.0" y="100" text-anchor="middle" font-size="11.5">MLP over sequence</text><text class="quiet" x="472.0" y="116" text-anchor="middle" font-size="11.5">or pool every K</text><path class="edge" d="M552 94H574" fill="none" stroke-width="1.25" marker-end="url(#a)"/><rect class="box" x="576" y="56" width="160" height="76" rx="8"/><text class="ink" x="656.0" y="80" text-anchor="middle" font-size="13" font-weight="600">LLM recommender</text><text class="quiet" x="656.0" y="100" text-anchor="middle" font-size="11.5">soft + text tokens</text><text class="quiet" x="656.0" y="116" text-anchor="middle" font-size="11.5">rank or generate</text><text class="quiet" x="24" y="162" text-anchor="start" font-size="11.5">A history item drops from 12 text tokens to 1 soft token; the ranking prompt shrinks from 1,536 to 480 tokens.</text></svg>