<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Two agent sandbox architectures: NVIDIA OpenShell and AWS Strands Box" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Two agent sandbox architectures: NVIDIA OpenShell and AWS Strands Box</title>
<style>
  text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .h{font-size:16px;font-weight:700} .q{fill:#59636e;font-size:12px} .b{font-size:13.5px;font-weight:600} .s{font-size:11.5px;fill:#59636e}
  .zone{fill:#fff4ec;stroke:#bc4c00;stroke-width:1.75;stroke-dasharray:6 5}
  .zl{fill:#bc4c00;font-size:12px;font-weight:700}
  .trust{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.25}
  .box{fill:#fff;stroke:#8c959f;stroke-width:1.5}
  .agent{fill:#fff;stroke:#bc4c00;stroke-width:2}
  .pol{fill:rgba(9,105,218,.08);stroke:#0969da;stroke-width:1.75}
  .ln{stroke:#8c959f;stroke-width:1.75;fill:none}
  .out{stroke:#0969da;stroke-width:2.25;fill:none}
  .ah{fill:#8c959f} .ahb{fill:#0969da}
  .ph{fill:#fff;stroke:#bc4c00;stroke-width:1.5} .phT{font-size:10.5px;font-weight:700;fill:#bc4c00}
  .rk{fill:#0969da;stroke:#0969da} .rkT{font-size:10.5px;font-weight:700;fill:#fff}
  .net{fill:#fff;stroke:#1f2328;stroke-width:1.5}
  @media (prefers-reduced-motion: reduce){ .mv{display:none} }
</style>
<defs>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ahb" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect width="760" height="420" fill="#fff"/>
<line x1="380" y1="20" x2="380" y2="400" stroke="#d0d7de" stroke-width="1"/>

<!-- ===== OpenShell ===== -->
<text class="h" x="24" y="34">NVIDIA OpenShell</text>
<text class="q" x="24" y="52">a runtime for fleets of agents</text>

<rect class="trust" x="24" y="66" width="332" height="66" rx="10"/>
<text class="b" x="40" y="90">Gateway (control plane)</text>
<text class="s" x="40" y="108">creates sandboxes · delivers policy · attaches credentials</text>
<text class="s" x="40" y="123">policy prover flags risky new access → human review</text>

<rect class="zone" x="24" y="160" width="170" height="150" rx="10"/>
<text class="zl" x="36" y="180">SANDBOX (untrusted)</text>
<text class="s" x="36" y="196">Landlock · seccomp</text>
<rect class="agent" x="44" y="212" width="124" height="56" rx="8"/>
<text class="b" x="106" y="236" text-anchor="middle">Agent</text>
<text class="s" x="106" y="254" text-anchor="middle">holds no real key</text>

<rect class="pol" x="222" y="160" width="134" height="150" rx="10"/>
<text class="b" x="289" y="186" text-anchor="middle">Supervisor</text>
<text class="s" x="289" y="204" text-anchor="middle">(trusted side)</text>
<text class="s" x="289" y="228" text-anchor="middle">checks policy</text>
<text class="s" x="289" y="244" text-anchor="middle">resolves DNS</text>
<text class="s" x="289" y="260" text-anchor="middle">opens connections</text>
<text class="s" x="289" y="276" text-anchor="middle">adds the real key</text>

<path class="ln" d="M168 240 H220" marker-end="url(#g)"/>
<path class="ln" d="M109 132 V158" marker-end="url(#g)"/>

<rect class="net" x="222" y="346" width="134" height="40" rx="20"/>
<text class="b" x="289" y="371" text-anchor="middle">Approved hosts</text>
<path class="out" d="M289 310 V344" marker-end="url(#b)"/>
<text class="s" x="24" y="340">Outer fence, in case the</text>
<text class="s" x="24" y="355">sandbox is escaped: networking</text>
<text class="s" x="24" y="370">off, Kubernetes NetworkPolicy,</text>
<text class="s" x="24" y="385">or a VM with no network device.</text>

<!-- animated request: plain inside the sandbox, keyed after the supervisor -->
<g class="mv">
  <g><rect class="ph" x="-30" y="-9" width="60" height="18" rx="9"/><text class="phT" x="0" y="4" text-anchor="middle">request</text>
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.4;1" calcMode="linear" path="M150 240 H222"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.4;0.45;1"/></g>
  <g opacity="0"><rect class="rk" x="-30" y="-9" width="60" height="18" rx="9"/><text class="rkT" x="0" y="4" text-anchor="middle">+ real key</text>
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.85;1" calcMode="linear" path="M289 296 V332"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.48;0.52;0.9;1"/></g>
</g>

<!-- ===== Strands Box ===== -->
<text class="h" x="404" y="34">AWS Strands Box</text>
<text class="q" x="404" y="52">a local sandbox with a memory</text>

<rect class="zone" x="404" y="66" width="150" height="244" rx="10"/>
<text class="zl" x="416" y="86">CONTAINMENT</text>
<text class="s" x="416" y="102">macOS Seatbelt</text>
<text class="s" x="416" y="117">(untrusted)</text>
<rect class="agent" x="420" y="150" width="118" height="70" rx="8"/>
<text class="b" x="479" y="176" text-anchor="middle">Agent</text>
<text class="s" x="479" y="194" text-anchor="middle">holds a</text>
<text class="s" x="479" y="209" text-anchor="middle">placeholder key</text>

<rect class="trust" x="578" y="66" width="160" height="244" rx="10"/>
<text class="b" x="658" y="88" text-anchor="middle">Box process (trusted)</text>
<rect class="box" x="592" y="100" width="132" height="28" rx="6"/><text class="s" x="658" y="118" text-anchor="middle" style="fill:#1f2328">Shell interpreter</text>
<rect class="box" x="592" y="134" width="132" height="28" rx="6"/><text class="s" x="658" y="152" text-anchor="middle" style="fill:#1f2328">Python interpreter</text>
<rect class="box" x="592" y="168" width="132" height="28" rx="6"/><text class="s" x="658" y="186" text-anchor="middle" style="fill:#1f2328">MCP broker</text>
<rect class="box" x="592" y="262" width="132" height="28" rx="6"/><text class="s" x="658" y="280" text-anchor="middle" style="fill:#1f2328">Egress gateway</text>
<rect class="pol" x="592" y="202" width="132" height="54" rx="6"/>
<text class="b" x="658" y="224" text-anchor="middle" style="font-size:12.5px">Dogwood engine</text>
<text class="s" x="658" y="242" text-anchor="middle">+ shared action history</text>

<path class="ln" d="M538 172 L590 114" marker-end="url(#g)"/>
<path class="ln" d="M538 180 L590 148" marker-end="url(#g)"/>
<path class="ln" d="M538 190 L590 182" marker-end="url(#g)"/>
<path class="ln" d="M538 205 L590 274" marker-end="url(#g)"/>

<rect class="net" x="592" y="346" width="132" height="40" rx="20"/>
<text class="b" x="658" y="371" text-anchor="middle">Allowed hosts</text>
<path class="out" d="M658 290 V344" marker-end="url(#b)"/>
<text class="s" x="404" y="352">Every enforcement point asks the</text>
<text class="s" x="404" y="367">engine, and logs to one history:</text>
<text class="s" x="404" y="382">fs:read, fs:delete, http:request, …</text>

<g class="mv">
  <g><rect class="ph" x="-34" y="-9" width="68" height="18" rx="9"/><text class="phT" x="0" y="4" text-anchor="middle">placeholder</text>
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.4;1" calcMode="linear" path="M538 205 L590 274"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.4;0.45;1"/></g>
  <g opacity="0"><rect class="rk" x="-30" y="-9" width="60" height="18" rx="9"/><text class="rkT" x="0" y="4" text-anchor="middle">real key</text>
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.85;1" calcMode="linear" path="M658 296 V332"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.48;0.52;0.9;1"/></g>
</g>
</svg>
