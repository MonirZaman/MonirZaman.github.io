<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Agent security has three lanes: prevention, containment, and detection and response. This post covers containment." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Agent security has three lanes: prevention, containment, and detection and response. This post covers containment.</title>
<style>
  text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .h{font-size:15px;font-weight:700} .q{font-size:12px;fill:#59636e} .it{font-size:12px} .sec{font-size:11px;fill:#59636e}
  .lane{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.25}
  .focus{fill:rgba(9,105,218,.06);stroke:#0969da;stroke-width:2}
  .brace{stroke:#8c959f;stroke-width:1.5;fill:none}
  .tag{fill:#0969da} .tagT{font-size:10.5px;font-weight:700;fill:#fff;letter-spacing:.04em}
  .dot{fill:#8c959f}
  .track{stroke:#d0d7de;stroke-width:2;stroke-dasharray:4 4}
  .soft{stroke:#9a6700;stroke-width:2;stroke-dasharray:5 4}
  .wall{fill:#1a7f37}
  .tok{fill:#bc4c00} .tokT{font-size:10.5px;font-weight:700;fill:#fff}
  .ok{fill:#1a7f37} .okT{font-size:10.5px;font-weight:700;fill:#fff}
  .log{fill:#fff;stroke:#59636e;stroke-width:1.25} .logT{font-size:10.5px;font-weight:700;fill:#59636e;font-family:ui-monospace,Menlo,Consolas,monospace}
  @media (prefers-reduced-motion: reduce){ .mv{display:none} .still{display:inline} }
  .still{display:none}
</style>
<rect width="760" height="380" fill="#fff"/>

<!-- umbrella -->
<path class="brace" d="M16 34 V24 H744 V34"/>
<text class="h" x="380" y="18" text-anchor="middle">Agent security</text>

<!-- lanes -->
<rect class="lane" x="16" y="44" width="234" height="250" rx="10"/>
<rect class="focus" x="263" y="44" width="234" height="250" rx="10"/>
<rect class="lane" x="510" y="44" width="234" height="250" rx="10"/>

<rect class="tag" x="404" y="52" width="84" height="18" rx="9"/><text class="tagT" x="446" y="65" text-anchor="middle">THIS POST</text>

<text class="h" x="30" y="70">1 · Prevention</text>
<text class="q" x="30" y="88">Stop the agent being tricked</text>
<text class="h" x="277" y="70">2 · Containment</text>
<text class="q" x="277" y="88">Limit what it can do</text>
<text class="h" x="524" y="70">3 · Detection &amp; response</text>
<text class="q" x="524" y="88">Notice it and recover</text>

<!-- lane 1 items -->
<circle class="dot" cx="34" cy="116" r="3"/><text class="it" x="44" y="120">Model safety training,</text><text class="it" x="44" y="135">injection classifiers</text><text class="sec" x="206" y="120">§3</text>
<circle class="dot" cx="34" cy="158" r="3"/><text class="it" x="44" y="162">Plan before reading</text><text class="it" x="44" y="177">untrusted data (CaMeL)</text><text class="sec" x="206" y="162">§7</text>
<circle class="dot" cx="34" cy="200" r="3"/><text class="it" x="44" y="204">Rules first, LLM judges</text><text class="it" x="44" y="219">only on narrow inputs</text><text class="sec" x="206" y="204">§7</text>

<!-- lane 2 items -->
<circle class="dot" cx="281" cy="116" r="3"/><text class="it" x="291" y="120">Rule of Two: never all</text><text class="it" x="291" y="135">three risky properties</text><text class="sec" x="460" y="120">§2</text>
<circle class="dot" cx="281" cy="158" r="3"/><text class="it" x="291" y="162">Sandbox enforced outside</text><text class="it" x="291" y="177">the agent</text><text class="sec" x="460" y="162">§3–4</text>
<circle class="dot" cx="281" cy="200" r="3"/><text class="it" x="291" y="204">Egress, keys and</text><text class="it" x="291" y="219">history rules</text><text class="sec" x="460" y="204">§4–5</text>
<circle class="dot" cx="281" cy="242" r="3"/><text class="it" x="291" y="246">Approvals, spend caps,</text><text class="it" x="291" y="261">nested boundaries</text><text class="sec" x="460" y="246">§4, §6</text>

<!-- lane 3 items -->
<circle class="dot" cx="528" cy="116" r="3"/><text class="it" x="538" y="120">Audit log the agent</text><text class="it" x="538" y="135">can't edit</text><text class="sec" x="706" y="120">§4</text>
<circle class="dot" cx="528" cy="158" r="3"/><text class="it" x="538" y="162">Alerts fast enough</text><text class="it" x="538" y="177">to page someone</text><text class="sec" x="706" y="162">§6</text>
<circle class="dot" cx="528" cy="200" r="3"/><text class="it" x="538" y="204">Patch, rotate keys,</text><text class="it" x="538" y="219">rebuild</text><text class="sec" x="706" y="204">§6</text>

<!-- one bad action crossing the lanes -->
<line class="track" x1="30" y1="330" x2="730" y2="330"/>
<line class="soft" x1="200" y1="312" x2="200" y2="348"/>
<text class="sec" x="200" y="366" text-anchor="middle">might catch it</text>
<rect class="wall" x="440" y="310" width="8" height="40" rx="2"/>
<text class="sec" x="444" y="366" text-anchor="middle">blocks it</text>

<g class="mv">
  <g><rect class="tok" x="-44" y="-10" width="88" height="20" rx="10"/><text class="tokT" x="0" y="4" text-anchor="middle">bad action</text>
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0.35;0.38;1;1" keyTimes="0;0.25;0.3;0.55;1" calcMode="linear" path="M70 330 H392"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.55;0.57;1"/></g>
  <g opacity="0"><rect class="ok" x="-40" y="-10" width="80" height="20" rx="10"/><text class="okT" x="0" y="4" text-anchor="middle">✓ blocked</text>
    <animateMotion dur="6s" repeatCount="indefinite" path="M392 330 H392"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.55;0.57;0.92;1"/></g>
  <g opacity="0"><rect class="log" x="-58" y="-10" width="116" height="20" rx="4"/><text class="logT" x="0" y="4" text-anchor="middle">denial logged</text>
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6;0.75;1" calcMode="linear" path="M560 330 H627"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6;0.63;0.92;1"/></g>
</g>
<g class="still">
  <rect class="ok" x="352" y="320" width="80" height="20" rx="10"/><text class="okT" x="392" y="334" text-anchor="middle">✓ blocked</text>
  <rect class="log" x="569" y="320" width="116" height="20" rx="4"/><text class="logT" x="627" y="334" text-anchor="middle">denial logged</text>
</g>
</svg>
