<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 630" role="img" aria-label="Agent security has three lanes: prevention, containment, and detection and response. This post covers containment." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Agent security has three lanes: prevention, containment, and detection and response. This post covers containment.</title>
<style>
  text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .h{font-size:16px;font-weight:700} .q{font-size:13px;fill:#59636e} .it{font-size:13.5px} .sec{font-size:12px;fill:#59636e}
  .lane{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.25}
  .focus{fill:rgba(9,105,218,.06);stroke:#0969da;stroke-width:2}
  .brace{stroke:#8c959f;stroke-width:1.5;fill:none}
  .tag{fill:#0969da} .tagT{font-size:10.5px;font-weight:700;fill:#fff;letter-spacing:.04em}
  .dot{fill:#8c959f}
  .track{stroke:#d0d7de;stroke-width:2;stroke-dasharray:4 4}
  .soft{stroke:#9a6700;stroke-width:2;stroke-dasharray:5 4}
  .wall{fill:#1a7f37}
  .tok{fill:#bc4c00} .tokT{font-size:10.5px;font-weight:700;fill:#fff}
  .ok{fill:#1a7f37} .okT{font-size:10.5px;font-weight:700;fill:#fff}
  .log{fill:#fff;stroke:#59636e;stroke-width:1.25} .logT{font-size:10.5px;font-weight:700;fill:#59636e;font-family:ui-monospace,Menlo,Consolas,monospace}
  @media (prefers-reduced-motion: reduce){ .mv{display:none} .still{display:inline} }
  .still{display:none}
</style>
<rect width="360" height="630" fill="#fff"/>
<path class="brace" d="M20 48 H12 V546 H20"/>
<text class="h" x="12" y="28">Agent security</text>
<rect class="lane" x="22" y="48" width="322" height="150" rx="10"/>
<text class="h" x="36" y="74">1 · Prevention</text>
<text class="q" x="36" y="93">Stop the agent being tricked</text>
<circle class="dot" cx="40" cy="116" r="3"/><text class="it" x="50" y="120">Model safety training, classifiers</text><text class="sec" x="330" y="120" text-anchor="end">§3</text>
<circle class="dot" cx="40" cy="140" r="3"/><text class="it" x="50" y="144">Plan before reading untrusted data</text><text class="sec" x="330" y="144" text-anchor="end">§7</text>
<circle class="dot" cx="40" cy="164" r="3"/><text class="it" x="50" y="168">Rules first, narrow LLM judges</text><text class="sec" x="330" y="168" text-anchor="end">§7</text>
<rect class="focus" x="22" y="210" width="322" height="174" rx="10"/>
<rect class="tag" x="246" y="220" width="88" height="18" rx="9"/><text class="tagT" x="290" y="233" text-anchor="middle">THIS POST</text>
<text class="h" x="36" y="236">2 · Containment</text>
<text class="q" x="36" y="255">Limit what it can do</text>
<circle class="dot" cx="40" cy="278" r="3"/><text class="it" x="50" y="282">Rule of Two</text><text class="sec" x="330" y="282" text-anchor="end">§2</text>
<circle class="dot" cx="40" cy="302" r="3"/><text class="it" x="50" y="306">Sandbox enforced outside agent</text><text class="sec" x="330" y="306" text-anchor="end">§3–4</text>
<circle class="dot" cx="40" cy="326" r="3"/><text class="it" x="50" y="330">Egress, keys, history rules</text><text class="sec" x="330" y="330" text-anchor="end">§4–5</text>
<circle class="dot" cx="40" cy="350" r="3"/><text class="it" x="50" y="354">Approvals, caps, nested walls</text><text class="sec" x="330" y="354" text-anchor="end">§4, §6</text>
<rect class="lane" x="22" y="396" width="322" height="150" rx="10"/>
<text class="h" x="36" y="422">3 · Detection &amp; response</text>
<text class="q" x="36" y="441">Notice it and recover</text>
<circle class="dot" cx="40" cy="464" r="3"/><text class="it" x="50" y="468">Audit log the agent can’t edit</text><text class="sec" x="330" y="468" text-anchor="end">§4</text>
<circle class="dot" cx="40" cy="488" r="3"/><text class="it" x="50" y="492">Alerts fast enough to page</text><text class="sec" x="330" y="492" text-anchor="end">§6</text>
<circle class="dot" cx="40" cy="512" r="3"/><text class="it" x="50" y="516">Patch, rotate keys, rebuild</text><text class="sec" x="330" y="516" text-anchor="end">§6</text>
<line class="track" x1="20" y1="580" x2="340" y2="580"/>
<line class="soft" x1="100" y1="562" x2="100" y2="598"/><text class="sec" x="100" y="618" text-anchor="middle">might catch it</text>
<rect class="wall" x="230" y="560" width="8" height="40" rx="2"/><text class="sec" x="234" y="618" text-anchor="middle">blocks it</text>
<g class="mv">
  <g><rect class="tok" x="-44" y="-10" width="88" height="20" rx="10"/><text class="tokT" x="0" y="4" text-anchor="middle">bad action</text>
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0.4;0.44;1;1" keyTimes="0;0.25;0.3;0.55;1" calcMode="linear" path="M56 580 H182"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.55;0.57;1"/></g>
  <g opacity="0"><rect class="ok" x="-40" y="-10" width="80" height="20" rx="10"/><text class="okT" x="0" y="4" text-anchor="middle">✓ blocked</text>
    <animateMotion dur="6s" repeatCount="indefinite" path="M182 580 H182"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.55;0.57;0.92;1"/></g>
  <g opacity="0"><rect class="log" x="-50" y="-10" width="100" height="20" rx="4"/><text class="logT" x="0" y="4" text-anchor="middle">denial logged</text>
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6;0.75;1" calcMode="linear" path="M290 552 H290"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6;0.63;0.92;1"/></g>
</g>
<g class="still">
  <rect class="ok" x="142" y="570" width="80" height="20" rx="10"/><text class="okT" x="182" y="584" text-anchor="middle">✓ blocked</text>
  <rect class="log" x="240" y="542" width="100" height="20" rx="4"/><text class="logT" x="290" y="556" text-anchor="middle">denial logged</text>
</g>
</svg>
