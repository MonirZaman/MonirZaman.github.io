<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="CrowdStrike's seven containment layers: four nested boundaries, two channel gates, and resource limits" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>CrowdStrike's seven containment layers: four nested boundaries, two channel gates, and resource limits</title>
<style>
  text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .lb{font-size:12px;font-weight:700} .ls{font-size:11px;fill:#59636e} .b{font-size:13.5px;font-weight:700} .s{font-size:11.5px;fill:#59636e}
  .r1{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.25}
  .r2{fill:#eef1f4;stroke:#8c959f;stroke-width:1.25}
  .r3{fill:#e6eaef;stroke:#8c959f;stroke-width:1.25}
  .r4{fill:#fff4ec;stroke:#bc4c00;stroke-width:1.75;stroke-dasharray:6 5}
  .agent{fill:#fff;stroke:#bc4c00;stroke-width:2}
  .gate{fill:rgba(9,105,218,.08);stroke:#0969da;stroke-width:1.75}
  .side{fill:#fff;stroke:#8c959f;stroke-width:1.25}
  .band{fill:rgba(26,127,55,.09);stroke:#1a7f37;stroke-width:1.5}
  .ln{stroke:#8c959f;stroke-width:1.75;fill:none}
  .out{stroke:#0969da;stroke-width:2.25;fill:none}
  .esc{stroke:#9a6700;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
  .ah{fill:#8c959f} .ahb{fill:#0969da} .ahy{fill:#9a6700}
  .net{fill:#fff;stroke:#1f2328;stroke-width:1.5}
  .cA{fill:#fff;stroke:#bc4c00;stroke-width:1.5} .cAT{font-size:10.5px;font-weight:700;fill:#bc4c00;font-family:ui-monospace,Menlo,Consolas,monospace}
  .cX{fill:#cf222e} .cXT{font-size:10.5px;font-weight:700;fill:#fff}
  .cB{fill:#0969da} .cBT{font-size:10.5px;font-weight:700;fill:#fff}
  @media (prefers-reduced-motion: reduce){ .mv{display:none} }
</style>
<defs>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ahb" d="M0 0L10 5L0 10z"/></marker>
  <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ahy" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect width="760" height="470" fill="#fff"/>

<!-- nested boundaries 1-4 -->
<rect class="r1" x="16" y="16" width="532" height="372" rx="14"/>
<text class="lb" x="30" y="38">1 · Isolated network</text><text class="ls" x="160" y="38">default-deny egress, inspecting proxy</text>
<rect class="r2" x="34" y="50" width="496" height="322" rx="12"/>
<text class="lb" x="48" y="72">2 · Dedicated VM per harness</text><text class="ls" x="228" y="72">snapshot, inspect, revert</text>
<rect class="r3" x="52" y="84" width="460" height="272" rx="10"/>
<text class="lb" x="66" y="106">3 · Container</text><text class="ls" x="160" y="106">seccomp, AppArmor, unprivileged</text>
<rect class="r4" x="70" y="118" width="424" height="222" rx="10"/>
<text class="lb" x="84" y="140" style="fill:#bc4c00">4 · ward</text><text class="ls" x="146" y="140">Landlock / Seatbelt, egress proxy, credentials</text>

<!-- agent and gates -->
<rect class="agent" x="88" y="196" width="112" height="70" rx="9"/>
<text class="b" x="144" y="226" text-anchor="middle">Agent</text>
<text class="s" x="144" y="244" text-anchor="middle">no real keys</text>

<rect class="gate" x="262" y="164" width="214" height="56" rx="8"/>
<text class="b" x="276" y="186">6 · Baywatch</text>
<text class="s" x="276" y="204">every shell command: allow, log,</text>
<text class="s" x="276" y="217" style="font-size:11px">escalate or deny</text>
<rect class="gate" x="262" y="248" width="214" height="56" rx="8"/>
<text class="b" x="276" y="270">5 · ward-mcp</text>
<text class="s" x="276" y="288">every MCP tool call: allow-list,</text>
<text class="s" x="276" y="301" style="font-size:11px">parameters, destination limits</text>

<path class="ln" d="M200 218 H260" marker-end="url(#g)"/>
<path class="ln" d="M200 248 Q230 276 260 276" marker-end="url(#g)"/>
<text class="s" x="230" y="210" text-anchor="middle">shell</text>
<text class="s" x="214" y="296" text-anchor="middle">tools</text>

<!-- outbound path through every boundary -->
<path class="out" d="M476 276 H606" marker-end="url(#b)"/>
<rect class="net" x="608" y="256" width="138" height="40" rx="20"/>
<text class="b" x="677" y="281" text-anchor="middle">Outside world</text>
<text class="s" x="560" y="268" text-anchor="middle">crosses 4→1</text>

<!-- side: audit log, human approver -->
<rect class="side" x="572" y="40" width="174" height="72" rx="9"/>
<text class="b" x="586" y="64">Audit log</text>
<text class="s" x="586" y="82">chained, append-only;</text>
<text class="s" x="586" y="97">the agent can't edit it</text>
<rect class="side" x="572" y="150" width="174" height="76" rx="9" style="stroke:#9a6700"/>
<text class="b" x="586" y="174">Human approver</text>
<text class="s" x="586" y="192">per-run approvals;</text>
<text class="s" x="586" y="207">no answer = deny</text>
<path class="esc" d="M476 184 H570" marker-end="url(#y)"/>
<text class="s" x="523" y="178" text-anchor="middle" style="fill:#9a6700">escalate</text>

<!-- layer 7 band -->
<rect class="band" x="16" y="404" width="730" height="50" rx="10"/>
<text class="lb" x="32" y="426" style="fill:#1a7f37">7 · Resource containment, at every boundary</text>
<text class="s" x="32" y="443">quotas · rate and concurrency limits · wall-clock limits · spend ceilings · compute caps — all fail closed</text>

<!-- animation: git push denied at Baywatch; an allowed tool call passes ward-mcp and leaves -->
<g class="mv">
  <g><rect class="cA" x="-34" y="-10" width="68" height="20" rx="10"/><text class="cAT" x="0" y="4" text-anchor="middle">git push</text>
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear" path="M196 218 H300"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.25;0.27;1"/></g>
  <g opacity="0"><rect class="cX" x="-30" y="-10" width="60" height="20" rx="10"/><text class="cXT" x="0" y="4" text-anchor="middle">✕ deny</text>
    <animateMotion dur="6s" repeatCount="indefinite" path="M300 218 H300"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.26;0.28;0.45;0.47;1"/></g>
  <g opacity="0"><rect class="cB" x="-34" y="-10" width="68" height="20" rx="10"/><text class="cBT" x="0" y="4" text-anchor="middle">tool call</text>
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.95;1" calcMode="linear" path="M200 250 Q230 276 262 276 H600"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.49;0.51;0.94;1"/></g>
</g>
</svg>
